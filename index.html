<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ESP32 IoT Dashboard</title>


    <!-- MQTT.js -->

    <script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js">
    </script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fa;

            color: #111827;

            min-height: 100vh;
        }


        .container {

            width: 92%;

            max-width: 1050px;

            margin: auto;

            padding: 40px 0;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;
        }


        .title h1 {

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.7px;
        }


        .title p {

            margin-top: 7px;

            font-size: 14px;

            color: #6b7280;
        }


        /* =========================
           CONNECTION STATUS
        ========================= */

        .connection {

            display: flex;

            align-items: center;

            gap: 8px;

            background: white;

            padding: 10px 15px;

            border-radius: 30px;

            font-size: 13px;

            font-weight: 600;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.05);
        }


        .dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #ef4444;
        }


        .dot.connected {

            background: #22c55e;

            box-shadow:
                0 0 0 4px
                rgba(34, 197, 94, 0.12);
        }


        /* =========================
           SENSOR GRID
        ========================= */

        .sensor-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.05);
        }


        .card-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .card-title {

            font-size: 12px;

            font-weight: 700;

            color: #6b7280;

            letter-spacing: 1px;
        }


        .icon {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            background: #f3f4f6;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;
        }


        .value {

            font-size: 45px;

            font-weight: 700;

            letter-spacing: -1px;
        }


        .unit {

            font-size: 18px;

            color: #6b7280;

            margin-left: 4px;
        }


        .description {

            margin-top: 8px;

            font-size: 13px;

            color: #9ca3af;
        }


        /* =========================
           LED CARD
        ========================= */

        .led-card {

            margin-top: 18px;

            background: #111827;

            color: white;

            border-radius: 20px;

            padding: 25px;
        }


        .led-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .led-title {

            font-size: 12px;

            font-weight: 700;

            color: #9ca3af;

            letter-spacing: 1px;
        }


        .led-content {

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }


        .led-info {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .led-light {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            background: #374151;

            transition: 0.3s;
        }


        .led-light.on {

            background: #22c55e;

            box-shadow:
                0 0 30px
                rgba(34, 197, 94, 0.6);
        }


        .led-state {

            font-size: 20px;

            font-weight: 700;
        }


        .led-pin {

            margin-top: 4px;

            font-size: 12px;

            color: #9ca3af;
        }


        /* =========================
           TOGGLE SWITCH
        ========================= */

        .switch {

            position: relative;

            display: inline-block;

            width: 60px;

            height: 32px;
        }


        .switch input {

            opacity: 0;

            width: 0;

            height: 0;
        }


        .slider {

            position: absolute;

            inset: 0;

            background: #4b5563;

            border-radius: 50px;

            cursor: pointer;

            transition: 0.3s;
        }


        .slider::before {

            content: "";

            position: absolute;

            width: 24px;

            height: 24px;

            left: 4px;

            top: 4px;

            background: white;

            border-radius: 50%;

            transition: 0.3s;
        }


        input:checked + .slider {

            background: #22c55e;
        }


        input:checked + .slider::before {

            transform:
                translateX(28px);
        }


        /* =========================
           MQTT STATUS
        ========================= */

        .mqtt-box {

            margin-top: 18px;

            padding: 16px 20px;

            background: white;

            border-radius: 15px;

            color: #6b7280;

            font-size: 13px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.04);
        }


        .mqtt-box strong {

            color: #111827;
        }


        /* =========================
           ERROR
        ========================= */

        #error {

            display: none;

            margin-top: 15px;

            padding: 14px;

            border-radius: 12px;

            background: #fef2f2;

            color: #b91c1c;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .sensor-grid {

                grid-template-columns: 1fr;
            }


            .value {

                font-size: 38px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==================================
         HEADER
    =================================== -->

    <div class="header">

        <div class="title">

            <h1>
                ESP32 Dashboard
            </h1>

            <p>
                DHT11 monitoring & LED control
            </p>

        </div>


        <div class="connection">

            <span
                id="statusDot"
                class="dot">
            </span>

            <span
                id="connectionText">

                Connecting...

            </span>

        </div>

    </div>



    <!-- ==================================
         SENSOR CARDS
    =================================== -->

    <div class="sensor-grid">


        <!-- TEMPERATURE -->

        <div class="card">

            <div class="card-header">

                <span class="card-title">

                    TEMPERATURE

                </span>


                <div class="icon">

                    🌡️

                </div>

            </div>


            <div>

                <span
                    id="temperature"
                    class="value">

                    --

                </span>


                <span class="unit">

                    °C

                </span>

            </div>


            <p class="description">

                DHT11 temperature

            </p>

        </div>



        <!-- HUMIDITY -->

        <div class="card">

            <div class="card-header">

                <span class="card-title">

                    HUMIDITY

                </span>


                <div class="icon">

                    💧

                </div>

            </div>


            <div>

                <span
                    id="humidity"
                    class="value">

                    --

                </span>


                <span class="unit">

                    %

                </span>

            </div>


            <p class="description">

                Relative humidity

            </p>

        </div>

    </div>



    <!-- ==================================
         LED CONTROL
    =================================== -->

    <div class="led-card">


        <div class="led-header">

            <span class="led-title">

                BUILT-IN LED

            </span>


            <span>

                💡

            </span>

        </div>



        <div class="led-content">


            <div class="led-info">


                <div
                    id="ledLight"
                    class="led-light">
                </div>


                <div>

                    <div
                        id="ledState"
                        class="led-state">

                        OFF

                    </div>


                    <div class="led-pin">

                        ESP32 GPIO 2

                    </div>

                </div>

            </div>



            <label class="switch">

                <input
                    type="checkbox"
                    id="ledSwitch">

                <span class="slider"></span>

            </label>


        </div>

    </div>



    <!-- ==================================
         MQTT STATUS
    =================================== -->

    <div class="mqtt-box">

        <strong>
            MQTT Status:
        </strong>


        <span id="mqttStatus">

            Connecting to HiveMQ Cloud...

        </span>

    </div>



    <!-- ==================================
         ERROR
    =================================== -->

    <div id="error"></div>


</div>



<script>


// =====================================================
// HIVEMQ CLOUD CONFIGURATION
// =====================================================

// IMPORTANT:
//
// Put your HiveMQ cluster hostname here.
//
// Example:
//
// abc123.s1.eu.hivemq.cloud
//
// DON'T use https://
// DON'T use mqtt://
// DON'T use wss://
//
// Just the hostname.

const MQTT_HOST =
    "2074a6aaa49749098fadd7116c34597c.s1.eu.hivemq.cloud";


// Browser MQTT connection

const MQTT_PORT = 8884;


// HiveMQ username

const MQTT_USERNAME =
    "nithya";


// HiveMQ password

const MQTT_PASSWORD =
    "nithyapalani";



// =====================================================
// MQTT TOPICS
// =====================================================

const TEMP_TOPIC =
    "esp32/dht11/temperature";

const HUM_TOPIC =
    "esp32/dht11/humidity";

const LED_TOPIC =
    "esp32/led";



// =====================================================
// GET HTML ELEMENTS
// =====================================================

const temperatureElement =
    document.getElementById(
        "temperature"
    );


const humidityElement =
    document.getElementById(
        "humidity"
    );


const ledSwitch =
    document.getElementById(
        "ledSwitch"
    );


const ledLight =
    document.getElementById(
        "ledLight"
    );


const ledState =
    document.getElementById(
        "ledState"
    );


const statusDot =
    document.getElementById(
        "statusDot"
    );


const connectionText =
    document.getElementById(
        "connectionText"
    );


const mqttStatus =
    document.getElementById(
        "mqttStatus"
    );


const errorBox =
    document.getElementById(
        "error"
    );



// =====================================================
// CREATE MQTT CLIENT ID
// =====================================================

const clientId =
    "web-dashboard-" +
    Math.random()
        .toString(16)
        .substring(2, 10);



// =====================================================
// HIVEMQ WEBSOCKET URL
// =====================================================

const brokerURL =
    "wss://" +
    MQTT_HOST +
    ":" +
    MQTT_PORT +
    "/mqtt";


console.log(
    "MQTT Broker:",
    brokerURL
);



// =====================================================
// CONNECT TO HIVEMQ
// =====================================================

const client =
    mqtt.connect(

        brokerURL,

        {

            clientId:
                clientId,

            username:
                MQTT_USERNAME,

            password:
                MQTT_PASSWORD,

            clean:
                true,

            reconnectPeriod:
                3000,

            connectTimeout:
                10000

        }

    );



// =====================================================
// MQTT CONNECTED
// =====================================================

client.on(
    "connect",
    function () {

        console.log(
            "Connected to HiveMQ Cloud!"
        );


        statusDot.classList.add(
            "connected"
        );


        connectionText.textContent =
            "Connected";


        mqttStatus.textContent =
            "Connected to HiveMQ Cloud";


        errorBox.style.display =
            "none";


        // Subscribe temperature

        client.subscribe(
            TEMP_TOPIC
        );


        // Subscribe humidity

        client.subscribe(
            HUM_TOPIC
        );


        // Subscribe LED

        client.subscribe(
            LED_TOPIC
        );


        console.log(
            "Subscribed to all MQTT topics"
        );

    }
);



// =====================================================
// MQTT MESSAGE RECEIVED
// =====================================================

client.on(
    "message",
    function (
        topic,
        message
    ) {


        const value =
            message.toString();


        console.log(
            "MQTT DATA:",
            topic,
            value
        );


        // -----------------------------------------
        // TEMPERATURE
        // -----------------------------------------

        if (
            topic === TEMP_TOPIC
        ) {

            const temp =
                parseFloat(value);


            if (
                !isNaN(temp)
            ) {

                temperatureElement.textContent =
                    temp.toFixed(1);
            }

        }


        // -----------------------------------------
        // HUMIDITY
        // -----------------------------------------

        if (
            topic === HUM_TOPIC
        ) {

            const humidity =
                parseFloat(value);


            if (
                !isNaN(humidity)
            ) {

                humidityElement.textContent =
                    humidity.toFixed(1);
            }

        }


        // -----------------------------------------
        // LED
        // -----------------------------------------

        if (
            topic === LED_TOPIC
        ) {

            updateLED(value);

        }

    }
);



// =====================================================
// UPDATE LED UI
// =====================================================

function updateLED(
    state
) {

    if (
        state === "ON"
    ) {

        ledSwitch.checked =
            true;


        ledLight.classList.add(
            "on"
        );


        ledState.textContent =
            "ON";

    }


    else if (
        state === "OFF"
    ) {

        ledSwitch.checked =
            false;


        ledLight.classList.remove(
            "on"
        );


        ledState.textContent =
            "OFF";

    }

}



// =====================================================
// LED SWITCH
// =====================================================

ledSwitch.addEventListener(
    "change",
    function () {


        const state =
            this.checked
            ? "ON"
            : "OFF";


        console.log(
            "Sending LED command:",
            state
        );


        client.publish(

            LED_TOPIC,

            state,

            {

                qos: 0,

                retain: true

            }

        );

    }
);



// =====================================================
// MQTT ERROR
// =====================================================

client.on(
    "error",
    function (error) {


        console.error(
            "MQTT ERROR:",
            error
        );


        connectionText.textContent =
            "Connection Error";


        mqttStatus.textContent =
            "Unable to connect to HiveMQ";


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "MQTT Error: " +
            error.message;

    }
);



// =====================================================
// MQTT OFFLINE
// =====================================================

client.on(
    "offline",
    function () {


        statusDot.classList.remove(
            "connected"
        );


        connectionText.textContent =
            "Disconnected";


        mqttStatus.textContent =
            "Connection lost. Reconnecting...";

    }
);



// =====================================================
// MQTT RECONNECT
// =====================================================

client.on(
    "reconnect",
    function () {


        connectionText.textContent =
            "Reconnecting...";


        mqttStatus.textContent =
            "Trying to reconnect...";

    }
);

</script>


</body>

</html>
